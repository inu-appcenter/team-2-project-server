name: CI & CD

on:
  pull_request:
    branches: [ "main" ] # PR 올릴 때마다 test job만 자동 실행
  workflow_dispatch: { } # deploy는 Actions 탭에서 수동으로 "Run workflow" 눌러야만 실행

permissions:
  contents: read
  packages: write # GHCR에 이미지 push 하기 위해 필요

jobs:
  # PR/push 시 항상 실행 — 테스트가 깨지면 여기서 잡힘
  test:
    runs-on: ubuntu-latest
    # @SpringBootTest가 실제 DB 연결을 필요로 해서, 테스트 동안만 쓰고 버릴 Postgres를 띄움
    # application-test.yml의 spring.datasource 값과 반드시 일치해야 함
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ttok_ttok_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

  # Actions 탭에서 수동으로 "Run workflow"를 눌렀을 때만 배포 (자동 배포 없음)
  # 실수로 다른 브랜치를 선택하고 실행하는 걸 막기 위해 main 브랜치일 때만 허용
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 운영 설정 파일을 GitHub Secret에서 그대로 복원 (레포에는 절대 커밋 안 함)
      - name: Create application.yml
        run: |
          cat > ./src/main/resources/application.yml <<'EOF'
          ${{ secrets.APPLICATION_YML }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # bootJar만 실행 (build 전체를 돌리면 plain jar가 같이 생겨서
      # Dockerfile의 COPY build/libs/*.jar 가 어떤 걸 복사할지 애매해짐)
      - name: Build jar
        run: ./gradlew bootJar -x test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/team-2-project-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST_ADDRESS }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "docker-compose.yml"
          target: ${{ secrets.MOUNT_PATH }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST_ADDRESS }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ${{ secrets.MOUNT_PATH }}
            docker compose pull app
            docker compose up -d app --no-deps
